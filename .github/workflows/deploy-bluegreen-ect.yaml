name: Blue-Green Deployment from ECR

on:
  repository_dispatch:
    types: [deploy-app]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy"
        required: true
      ecr_registry:
        description: "ECR registry URL"
        required: true
      repository:
        description: "ECR repository name"
        required: true
        default: "python_web_app"
      blue_green_tag:
        description: "Target environment (blue or green)"
        required: true
        default: "green"

env:
  NAMESPACE: default
  INGRESS_NAME: main-ingress
  CLUSTER_NAME: mi-cluster
  ACTIVE_SLOT_SSM_PARAM: /app-python-web/active-slot

jobs:
  deploy-bluegreen:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-To-K8s

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "${{ secrets.AWS_REGION }}"
          kubectl cluster-info

      - name: Extract deployment info
        id: info
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            IMAGE_TAG="${{ github.event.client_payload.image_tag }}"
            ECR_REGISTRY="${{ github.event.client_payload.ecr_registry }}"
            REPOSITORY="${{ github.event.client_payload.repository }}"
            TRIGGERED_BY="${{ github.event.client_payload.triggered_by }}"
            TARGET_SLOT="${{ github.event.client_payload.blue_green_tag }}"
          else
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            ECR_REGISTRY="${{ github.event.inputs.ecr_registry }}"
            REPOSITORY="${{ github.event.inputs.repository }}"
            TRIGGERED_BY="${{ github.actor }}"
            TARGET_SLOT="${{ github.event.inputs.blue_green_tag }}"
          fi

          if [ -z "$TARGET_SLOT" ]; then
            echo "blue_green_tag/target slot is required"
            exit 1
          fi

          FULL_IMAGE="${ECR_REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

          # Read previous active slot from SSM, fallback to blue.
          ACTIVE_SLOT=$(aws ssm get-parameter --name "$ACTIVE_SLOT_SSM_PARAM" --query 'Parameter.Value' --output text 2>/dev/null || echo "blue")

          if [ "$TARGET_SLOT" = "blue" ]; then
            ROLLBACK_BLUE=0
            ROLLBACK_GREEN=100
            PROMOTE_BLUE=100
            PROMOTE_GREEN=0
            TARGET_DEPLOYMENT="app-blue"
          else
            ROLLBACK_BLUE=100
            ROLLBACK_GREEN=0
            PROMOTE_BLUE=0
            PROMOTE_GREEN=100
            TARGET_DEPLOYMENT="app-green"
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "triggered_by=$TRIGGERED_BY" >> "$GITHUB_OUTPUT"
          echo "target_slot=$TARGET_SLOT" >> "$GITHUB_OUTPUT"
          echo "active_slot=$ACTIVE_SLOT" >> "$GITHUB_OUTPUT"
          echo "rollback_blue=$ROLLBACK_BLUE" >> "$GITHUB_OUTPUT"
          echo "rollback_green=$ROLLBACK_GREEN" >> "$GITHUB_OUTPUT"
          echo "promote_blue=$PROMOTE_BLUE" >> "$GITHUB_OUTPUT"
          echo "promote_green=$PROMOTE_GREEN" >> "$GITHUB_OUTPUT"
          echo "target_deployment=$TARGET_DEPLOYMENT" >> "$GITHUB_OUTPUT"

          echo "Triggered by: $TRIGGERED_BY"
          echo "Target slot: $TARGET_SLOT"
          echo "Current active slot (SSM): $ACTIVE_SLOT"
          echo "Image pushed by app repo: $FULL_IMAGE"

      - name: Ensure ingress exists
        run: |
          kubectl get ingress "$INGRESS_NAME" -n "$NAMESPACE"

      - name: Phase 1 - Canary 50/50
        run: |
          chmod +x k8s/k8s_fixed_scripts/blue-green-updater.sh
          bash k8s/k8s_fixed_scripts/blue-green-updater.sh "$NAMESPACE" "$INGRESS_NAME" 50 50
          echo "Waiting 60s for canary stabilization..."
          sleep 60

      - name: Health gate (app + rollout)
        id: gate
        run: |
          set +e
          ALB_HOST=$(kubectl get ingress "$INGRESS_NAME" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "ALB host: $ALB_HOST"

          # 1) Ensure target deployment is ready.
          kubectl rollout status "deployment/${{ steps.info.outputs.target_deployment }}" -n "$NAMESPACE" --timeout=180s
          rollout_rc=$?

          # 2) Probe health endpoint on ALB.
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://${ALB_HOST}/health.html")
            echo "Probe $i/12 => HTTP $code"
            if [ "$code" = "200" ]; then
              ok=$((ok + 1))
            fi
            sleep 5
          done

          if [ $rollout_rc -eq 0 ] && [ $ok -ge 10 ]; then
            echo "gate_result=pass" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "gate_result=fail" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Phase 2 - Promote 100% to target
        if: steps.gate.outputs.gate_result == 'pass'
        run: |
          chmod +x k8s/k8s_fixed_scripts/blue-green-updater.sh
          bash k8s/k8s_fixed_scripts/blue-green-updater.sh \
            "$NAMESPACE" \
            "$INGRESS_NAME" \
            "${{ steps.info.outputs.promote_blue }}" \
            "${{ steps.info.outputs.promote_green }}"

          aws ssm put-parameter \
            --name "$ACTIVE_SLOT_SSM_PARAM" \
            --type String \
            --value "${{ steps.info.outputs.target_slot }}" \
            --overwrite

      - name: Auto rollback to previous slot
        if: failure() && steps.gate.outputs.gate_result == 'fail'
        run: |
          chmod +x k8s/k8s_fixed_scripts/blue-green-updater.sh
          bash k8s/k8s_fixed_scripts/blue-green-updater.sh \
            "$NAMESPACE" \
            "$INGRESS_NAME" \
            "${{ steps.info.outputs.rollback_blue }}" \
            "${{ steps.info.outputs.rollback_green }}"

          aws ssm put-parameter \
            --name "$ACTIVE_SLOT_SSM_PARAM" \
            --type String \
            --value "${{ steps.info.outputs.active_slot }}" \
            --overwrite

      - name: Deployment summary
        if: always()
        run: |
          ALB_HOST=$(kubectl get ingress "$INGRESS_NAME" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered by: ${{ steps.info.outputs.triggered_by }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested target slot: ${{ steps.info.outputs.target_slot }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous active slot (SSM): ${{ steps.info.outputs.active_slot }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image (built in app repo): \`${{ steps.info.outputs.full_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ALB URL: http://${ALB_HOST}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Strategy" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Canary 50/50" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Health gate (rollout + HTTP probes)" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Promote to 100% or rollback automático" >> "$GITHUB_STEP_SUMMARY"
