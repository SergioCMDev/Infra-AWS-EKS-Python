apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-observability-loki-eks
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.28.0
      helm:
        values: |
          deploymentMode: SingleBinary
          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            storage:
              type: filesystem
            schemaConfig:
              configs:
                - from: "2024-01-01"
                  store: tsdb
                  object_store: filesystem
                  schema: v13
                  index:
                    prefix: index_
                    period: 24h
          singleBinary:
            replicas: 1
            persistence:
              enabled: true
              storageClass: gp3
              storageClassName: gp3
              size: 10Gi
          read:
            replicas: 0
          write:
            replicas: 0
          backend:
            replicas: 0
        valueFiles:
          - $values/k8s/observability/loki/values/eks.yaml
    - repoURL: https://github.com/SergioCMDev/Infra-AWS-EKS-Python
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
