apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-observability-eks
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/SergioCMDev/Infra-AWS-EKS-Python
    targetRevision: HEAD
    path: k8s/observability/applications/eks
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
